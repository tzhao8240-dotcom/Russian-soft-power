<section class="hero fade-in"><div class="overlay"><h2 data-en="Russian Ballet" data-zh="俄罗斯芭蕾"></h2>
<p data-en="Russian ballet has long been recognized as one of the country's most influential cultural exports. Institutions such as the Bolshoi in Moscow and the Mariinsky in Saint Petersburg represent a continuous tradition of rigorous training, expressive choreography, and internationally celebrated repertory. Touring productions and international collaborations allow Russian companies to shape global perceptions of Russian culture and to build cultural ties with audiences worldwide."
       data-zh="俄罗斯芭蕾长期以来被视为该国最具影响力的文化出口之一。莫斯科大剧院和圣彼得堡的马林斯基剧院等机构代表了严格训练、富于表现力的编舞和享誉世界的曲目传统。巡演和国际合作使俄罗斯剧团能够塑造全球对俄罗斯文化的认知，并与全球观众建立文化联系。"></p></div></section>

<section class="container">
  <div class="card fade-in">
    <h3 data-en="Historical Background" data-zh="历史背景"></h3>
    <p data-en="From Imperial patronage to Soviet-era state sponsorship, ballet in Russia evolved into a national institution. Conservatories and boarding schools have produced generations of dancers whose technical standards set international benchmarks."
       data-zh="从帝国赞助到苏联时期的国家支持，俄罗斯的芭蕾逐渐发展为一种国家机构。音乐学院和寄宿学校培养了代代舞者，其技术标准成为国际标杆。"></p>
  </div>

  <div class="card fade-in">
    <h3 data-en="Soft Power Effects" data-zh="软实力效应"></h3>
    <p data-en="Performances abroad, educational exchanges, and cross-cultural festivals enable ballet to function as a tool of cultural diplomacy. Audiences impressed by artistry and heritage are more open to cultural exchange, tourism, and academic collaboration."
       data-zh="海外演出、教育交流和跨文化节使芭蕾成为文化外交的工具。被艺术和传统打动的观众更容易接受文化交流、旅游和学术合作。"></p>
  </div>

  <div class="card fade-in">
    <h3 data-en="Representative Works & Institutions" data-zh="代表作品与机构"></h3>
    <p data-en="Key works such as Swan Lake and The Nutcracker remain staples of global repertoire. Institutions — Bolshoi, Mariinsky, and leading conservatories — continue to anchor Russia's cultural prestige."
       data-zh="《天鹅湖》《胡桃夹子》等代表作品仍是世界曲目的常青树。大剧院、马林斯基剧院以及顶级音乐学院继续巩固俄罗斯的文化声望。"></p>
  </div>
