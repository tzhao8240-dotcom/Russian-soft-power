<section class="hero fade-in"><div class="overlay"><h2 data-en="Red Square" data-zh="红场"></h2>
<p data-en="Red Square in Moscow functions as a symbolic urban space where history, ceremony, and national identity converge. As a locus of state parades, public commemorations, and tourism, the square communicates narratives of continuity and cultural depth."
       data-zh="莫斯科的红场是历史、仪式与民族认同交汇的象征性城市空间。作为国家阅兵、公共纪念和旅游的中心，红场传达着连续性与文化深度的叙事。"></p></div></section>

<section class="container">
  <div class="card fade-in">
    <h3 data-en="Historical Layers" data-zh="历史层面"></h3>
    <p data-en="From medieval marketplaces to imperial processions and Soviet ceremonies, Red Square's layered past gives it a unique resonance. Its architecture — notably St. Basil’s Cathedral and the Kremlin walls — anchors national memory."
       data-zh="从中世纪市场到帝国游行和苏联仪式，红场的历史层层叠叠，赋予其独特的共鸣。其建筑，尤其是圣瓦西里大教堂和克里姆林宫城墙，巩固了民族记忆。"></p>
  </div>

  <div class="card fade-in">
    <h3 data-en="Cultural & Touristic Role" data-zh="文化与旅游角色"></h3>
    <p data-en="As a tourist destination and ceremonial space, Red Square attracts global attention. Photographs, festivals, and official events shape external perceptions of Russia as a nation with deep historical roots."
       data-zh="作为旅游胜地和仪式空间，红场吸引全球关注。照片、节庆和官方活动塑造了外界对俄罗斯为具有深厚历史根基国家的看法。"></p>
  </div>

  <div class="card fade-in">
    <h3 data-en="Soft Power in Practice" data-zh="软实力实践"></h3>
    <p data-en="Red Square works alongside cultural exports and sporting success to present a multifaceted image abroad. Its iconic status amplifies messages conveyed through arts, media, and international events."
       data-zh="红场与文化出口和体育成功一同构建了向外界呈现的多面形象。其标志性地位放大了通过艺术、媒体和国际活动传达的信息。"></p>
  </div>
