<section class="hero fade-in"><div class="overlay"><h2 data-en="Ice Hockey" data-zh="冰球"></h2>
<p data-en="Ice hockey is among Russia's most visible sporting exports. From Soviet-era dominance to contemporary leagues and NHL stars, hockey contributes to national pride and international visibility. Athletic success in tournaments such as the Olympics and World Championships projects an image of competitiveness and modernity."
       data-zh="冰球是俄罗斯最具可见性的体育出口之一。从苏联时代的统治地位到当代联赛和NHL明星，冰球为国家自豪感和国际能见度做出贡献。奥运会和世界锦标赛等赛事中的成功展示了竞争力与现代性。"></p></div></section>

<section class="container">
  <div class="card fade-in">
    <h3 data-en="Development & Institutions" data-zh="发展与机构"></h3>
    <p data-en="National programs, youth academies, and professional clubs sustain a pipeline of talent. Ice hockey's institutional networks — from local clubs to international leagues — facilitate cultural exchanges and media coverage."
       data-zh="国家项目、青训学院和职业俱乐部维持着人才输送系统。从地方俱乐部到国际联赛，冰球的机构网络促进了文化交流和媒体报道。"></p>
  </div>

  <div class="card fade-in">
    <h3 data-en="International Achievements" data-zh="国际成就"></h3>
    <p data-en="Russia and the former Soviet Union have a long record of success in Olympic and World Championship competition. Such achievements create enduring narratives of national excellence that resonate with international audiences."
       data-zh="俄罗斯及前苏联在奥运会和世界锦标赛中拥有长期的成功记录。这些成就创造了持久的国家优秀叙事，与国际观众产生共鸣。"></p>
  </div>

  <div class="card fade-in">
    <h3 data-en="Soft Power Potential" data-zh="软实力潜能"></h3>
    <p data-en="Beyond competition, ice hockey functions as a social connector — fan cultures, youth programs, and international club tours build informal diplomacy and positive associations."
       data-zh="除了竞技层面，冰球还作为社会连接器——球迷文化、青训项目和国际俱乐部巡回带来非正式外交与积极联想。"></p>
  </div>
